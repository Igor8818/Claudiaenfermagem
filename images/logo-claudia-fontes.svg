<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <!-- Símbolo: Pé Anatômico em Turquesa e Mão Cuidadora em Lilás -->
  <g transform="translate(15, 8)">
    <!-- Dedos do Pé (Turquesa degradê suave) -->
    <defs>
      <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#14B8A6" />
        <stop offset="100%" stop-color="#0D9488" />
      </linearGradient>
      <linearGradient id="lilacGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#A78BFA" />
        <stop offset="100%" stop-color="#7C3AED" />
      </linearGradient>
      <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0D9488" flood-opacity="0.18" />
      </filter>
    </defs>

    <!-- Dedos dos pés com tamanhos anatômicos decrescentes -->
    <ellipse cx="62" cy="14" rx="5.5" ry="6.5" fill="url(#tealGrad)" transform="rotate(18 62 14)" />
    <circle cx="51" cy="18" r="4.8" fill="url(#tealGrad)" />
    <circle cx="43" cy="24" r="4.2" fill="url(#tealGrad)" />
    <circle cx="37" cy="31" r="3.6" fill="url(#tealGrad)" />
    <circle cx="33" cy="38" r="3" fill="url(#tealGrad)" />

    <!-- Curva harmônica da sola do pé (Estilo Linha Orgânica) -->
    <path d="M 60 28 C 45 42, 38 52, 54 64 C 62 70, 64 78, 52 86 C 45 91, 38 90, 32 85" 
          stroke="url(#tealGrad)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          fill="none" 
          filter="url(#softGlow)" />

    <!-- Mão Acolhedora / Cuidado Humano (Lilás Suave) -->
    <path d="M 18 78 C 30 92, 54 98, 72 91 C 78 88, 86 82, 92 78 C 84 81, 74 85, 62 85 C 46 85, 34 80, 24 73 Z" 
          fill="url(#lilacGrad)" />
    <circle cx="21" cy="74" r="2.8" fill="url(#lilacGrad)" />
  </g>

  <!-- Tipografia: Claudia Fontes -->
  <g transform="translate(130, 22)">
    <!-- Nome Principal: Claudia Fontes com fonte caligráfica sofisticada -->
    <text x="0" y="44" 
          font-family="'Playfair Display', 'Brush Script MT', 'Dancing Script', 'Outfit', cursive, serif" 
          font-size="44" 
          font-weight="600" 
          font-style="italic" 
          letter-spacing="0.5" 
          fill="#0F766E">
      Claudia Fontes
    </text>

    <!-- Linha Divisória de Requinte Clínico -->
    <line x1="2" y1="56" x2="280" y2="56" stroke="url(#lilacGrad)" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />

    <!-- Subtítulo Especializado -->
    <text x="3" y="72" 
          font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
          font-size="11" 
          font-weight="700" 
          letter-spacing="2.8" 
          fill="#0D9488">
      ENFERMAGEM ESPECIALIZADA
    </text>
    
    <text x="180" y="72" 
          font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
          font-size="11" 
          font-weight="500" 
          letter-spacing="1.5" 
          fill="#7C3AED">
      • PODOLOGIA &amp; LASER
    </text>
  </g>
</svg>
